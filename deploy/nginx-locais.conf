# Trecho comum do produto — incluído pelo server{} de produção e pelo de teste.
# ROOT aponta para /var/www/bancada-pro.

# página de vendas, login, css: abertos
# / passa pelo Flask: quem já tem sessão válida vai direto para /app/
# (/?vitrine mostra a página de vendas mesmo logado). /entrar decide no navegador.
location = /        { proxy_pass http://127.0.0.1:8811/api/inicio; include /var/www/bancada-pro/deploy/proxy-cabecalhos.conf; }
location = /entrar  { add_header Cache-Control "no-cache" always; try_files /publico/entrar.html =404; }
location = /comprar { add_header X-Robots-Tag "noindex" always; try_files /publico/comprar.html =404; }
location = /estilo.css { try_files /publico/estilo.css =404; }
location = /admin  { add_header X-Robots-Tag "noindex" always; add_header Cache-Control "no-store" always; try_files /publico/admin.html =404; }

# API de contas (Flask/gunicorn)
location /api/ {
    proxy_pass http://127.0.0.1:8811;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
}

# O APP: cada arquivo (inclusive questões e dossiê) só sai com sessão válida.
location /app/ {
    auth_request /_auth;
    error_page 401 = @entrar;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex" always;
    try_files $uri $uri/index.html =404;
}
location = /app { return 301 /app/; }
location @entrar { return 302 /entrar; }

location = /_auth {
    internal;
    proxy_pass http://127.0.0.1:8811/api/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header User-Agent $http_user_agent;
}

# nada mais do diretório é público (servidor/, dados-privados/, deploy/, .md)
location / { return 404; }
