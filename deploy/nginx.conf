# Bancada (produto) — https://bancada.sohan.sbs  ·  LAN: http://192.168.88.42:8802
#
# Reaproveita set_real_ip_from / real_ip_header / geo $origem_permitida definidos no
# vhost do site pessoal (sites-available/bancada-ifsc) — valem para o http{} inteiro,
# então NÃO os repita aqui. O Origin Certificate atual cobre *.sohan.sbs.
#
# Instalar/atualizar:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/bancada-pro
#   sudo ln -sf /etc/nginx/sites-available/bancada-pro /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 25443 ssl http2;
    listen [::]:25443 ssl http2;
    server_name bancada.sohan.sbs;
    ssl_certificate     /etc/nginx/cloudflare/origin.crt;
    ssl_certificate_key /etc/nginx/cloudflare/origin.key;

    if ($origem_permitida = 0) { return 403; }

    root /var/www/bancada-pro;
    include /var/www/bancada-pro/deploy/nginx-locais.conf;
}

# acesso pela rede local, sem Cloudflare (testes; sem TLS, então só use em casa)
server {
    listen 8802;
    listen [::]:8802;
    server_name _;
    root /var/www/bancada-pro;
    include /var/www/bancada-pro/deploy/nginx-locais.conf;
}
